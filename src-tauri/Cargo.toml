[package]
name = "splashhound"
version = "1.3.1"
description = "Splashhound - video library categorizer and viewer"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
authors = ["Leetdog"]
repository = "https://github.com/buddyLeetdog/splashhound"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.8.4", features = ["macros", "ws"] }
tokio-util = { version = "0.7.19", features = ["io"] }
walkdir = "2.5.0"
md-5 = "0.10.6"
anyhow = "1.0.104"
rfd = "0.17.2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
