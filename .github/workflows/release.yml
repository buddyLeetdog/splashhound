name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential

      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/splashhound.exe", "README.md", "LICENSE" `
            -DestinationPath "splashhound-windows-x64.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/splashhound dist/
          cp README.md LICENSE dist/
          tar -czf "splashhound-linux-x64.tar.gz" -C dist .
          bash packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"
          # Copy the package next to the other artifacts so all uploads share
          # one root directory.
          cp dist/splashhound_*_amd64.deb .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            splashhound-windows-x64.zip
            splashhound-linux-x64.tar.gz
            splashhound_*_amd64.deb

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/**/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
